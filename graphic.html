<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Selected graphic design work by Khutso Mokwena.">
    <title>Graphic Design | Khutso Mokwena</title>
    <link rel="stylesheet" href="graphic.css">
</head>
<body>
    <main class="design-page">
        <header class="design-header">
            <a class="back-link" href="index.html#projects">&larr; Back to portfolio</a>
            <p class="eyebrow">Selected work</p>
            <h1>Graphic Design</h1>
            <p class="intro">A selection of posters and promotional designs.</p>
        </header>

        <section class="design-gallery" aria-label="Graphic design portfolio">
            <figure class="design-item" id="unerased-poster">
                <img src="images/unerased-poster.png" alt="UnErased live event poster with a black and white performance photograph">
                <figcaption>
                    <h2>UnErased</h2>
                    <p>Live event poster</p>
                </figcaption>
            </figure>

            <figure class="design-item" id="photo-studio">
                <img src="images/photo-studio-poster.png" alt="Tshego's Photo Studio professional photography promotional poster">
                <figcaption>
                    <h2>Tshego’s Photo Studio</h2>
                    <p>Photography promotion</p>
                </figcaption>
            </figure>

            <figure class="design-item" id="havit-ad">
                <img src="images/havit-music-ad.png" alt="Havit wireless earbuds music advertisement">
                <figcaption>
                    <h2>Havit</h2>
                    <p>Music product advertisement</p>
                </figcaption>
            </figure>

            <figure class="design-item" id="bussin-ad">
                <img src="images/bussin-food-ad.png" alt="Bussin burger promotional advertisement">
                <figcaption>
                    <h2>Bussin</h2>
                    <p>Food promotion</p>
                </figcaption>
            </figure>
        </section>
    </main>
</body>
</html>
